services:
  - type: web
    name: gd-arena-ml
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt && python setup_voice.py
    startCommand: python app.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: GD_SPEECH_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: HF_HUB_DISABLE_TELEMETRY
        value: "1"
